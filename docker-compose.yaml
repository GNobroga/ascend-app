services:

  postgres:
    image: postgres:18
    container_name: postgres
    restart: unless-stopped
    ports:
      - 127.0.0.1:${DATABASE_PORT}:5432
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:

      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_gui
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

  storage:
    image: rustfs/rustfs:1.0.3
    container_name: storage
    restart: unless-stopped
    ports:
      - 127.0.0.1:${STORAGE_PORT}:9000
      - 127.0.0.1:${STORAGE_CONSOLE_PORT}:9001
    environment:
      RUSTFS_ACCESS_KEY: ${STORAGE_ROOT_USER}
      RUSTFS_SECRET_KEY: ${STORAGE_ROOT_PASSWORD}
      RUSTFS_ADDRESS: :9000
      RUSTFS_CONSOLE_ENABLE: 'true'
      RUSTFS_CONSOLE_ADDRESS: :9001
    volumes:
      - storage_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8.2-alpine
    container_name: redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - 127.0.0.1:${REDIS_PORT}:6379
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: evolution
    restart: unless-stopped
    ports:
      - 127.0.0.1:${EVOLUTION_PORT}:8080
    environment:
      SERVER_TYPE: http
      SERVER_PORT: 8080
      SERVER_URL: http://localhost:${EVOLUTION_PORT}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: 'false'
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${DATABASE_USER}:${DATABASE_PASSWORD}@postgres:5432/${DATABASE_NAME}?schema=evolution_api
      DATABASE_CONNECTION_CLIENT_NAME: ascend
      DATABASE_SAVE_DATA_INSTANCE: 'true'
      DATABASE_SAVE_DATA_NEW_MESSAGE: 'false'
      DATABASE_SAVE_MESSAGE_UPDATE: 'false'
      DATABASE_SAVE_DATA_CONTACTS: 'false'
      DATABASE_SAVE_DATA_CHATS: 'false'
      DATABASE_SAVE_DATA_LABELS: 'false'
      DATABASE_SAVE_DATA_HISTORIC: 'false'
      CACHE_REDIS_ENABLED: 'true'
      CACHE_REDIS_URI: redis://:${REDIS_PASSWORD}@redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_REDIS_SAVE_INSTANCES: 'false'
      CACHE_LOCAL_ENABLED: 'false'
      CONFIG_SESSION_PHONE_CLIENT: Ascend
      CONFIG_SESSION_PHONE_NAME: Chrome
      DEL_INSTANCE: 'false'
      LANGUAGE: pt-BR
      LOG_LEVEL: ERROR,WARN,INFO
      LOG_BAILEYS: error
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  storage_data:
  redis_data:
  evolution_instances:
